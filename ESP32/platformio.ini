; PlatformIO - ESP32 DevKit V1 (controlador)
; El código vive en Dispensador_ESP32/ para que también abra en Arduino IDE.
[platformio]
src_dir = Dispensador_ESP32

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
