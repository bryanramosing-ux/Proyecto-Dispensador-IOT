<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 900" width="1520" height="900" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Esquema de conexiones completo - Dispensador IoT</title>
<defs>
<marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<g id="gnd"><line x1="-10" y1="0" x2="10" y2="0" stroke="#000" stroke-width="2"/><line x1="-6" y1="5" x2="6" y2="5" stroke="#000" stroke-width="2"/><line x1="-2" y1="10" x2="2" y2="10" stroke="#000" stroke-width="2"/></g>
</defs>
<style>
    .blk{fill:#f7f9fc;stroke:#34495e;stroke-width:2}
    .aux{fill:#fff8e6;stroke:#b9770e;stroke-width:2;stroke-dasharray:6 3}
    .per{fill:#eef6ff;stroke:#1f4e79;stroke-width:2}
    .red{fill:#f4f6f6;stroke:#566573;stroke-width:2}
    .zona{fill:none;stroke-width:2;stroke-dasharray:9 5}
    .t{font-weight:bold;font-size:15px}
    .s{font-size:12px;fill:#444}
    .pin{font-size:12px;font-family:monospace}
    .vbat{stroke:#8e44ad;stroke-width:3;fill:none}
    .v6{stroke:#d62728;stroke-width:3;fill:none}
    .v5{stroke:#ff7f0e;stroke-width:3;fill:none}
    .gnd{stroke:#000;stroke-width:2.5;fill:none}
    .sig{stroke:#1f77b4;stroke-width:2;fill:none}
    .echo5{stroke:#8c564b;stroke-width:2;fill:none}
    .echo3{stroke:#17becf;stroke-width:2;fill:none}
    .adc{stroke:#2ca02c;stroke-width:2;fill:none}
    .pv{stroke:#b9770e;stroke-width:3;fill:none}
    .wifi{stroke:#7f8c8d;stroke-width:2;stroke-dasharray:7 5;fill:none}
    .res{fill:#fff;stroke:#000;stroke-width:1.5}
</style>
<rect width="1520" height="900" fill="#fff"/>
<text x="40" y="40" class="t" text-anchor="start" font-size="24">Dispensador IoT — montaje USB-C / 5 V</text>
<rect x="40" y="90" width="270" height="90" rx="6" class="aux"/>
<text x="175.0" y="110" class="t" text-anchor="middle" >Fuente regulada 5 V</text>
<text x="175.0" y="128" class="s" text-anchor="middle" >5 A recomendados; verificar corriente real</text>
<text x="175.0" y="144" class="s" text-anchor="middle" >Protección de sobrecorriente</text>
<text x="175.0" y="160" class="s" text-anchor="middle" >Distribución en estrella</text>
<rect x="440" y="90" width="320" height="190" rx="6" class="blk"/>
<text x="600.0" y="110" class="t" text-anchor="middle" >ESP32 DevKit V1</text>
<text x="600.0" y="128" class="s" text-anchor="middle" >VIN: 5 V; GND común</text>
<text x="600.0" y="144" class="s" text-anchor="middle" >PWM servo: GPIO25 → R3 330 Ω → SIG</text>
<text x="600.0" y="160" class="s" text-anchor="middle" >R4 10 kΩ: GPIO PWM a GND</text>
<text x="600.0" y="176" class="s" text-anchor="middle" >BOOT GPIO0; LED GPIO2</text>
<text x="600.0" y="192" class="s" text-anchor="middle" >USB del PC: solo programación</text>
<text x="600.0" y="208" class="s" text-anchor="middle" >Desconectar fuente externa al programar</text>
<rect x="1040" y="90" width="400" height="110" rx="6" class="blk"/>
<text x="1240.0" y="110" class="t" text-anchor="middle" >ESP32-CAM AI-Thinker</text>
<text x="1240.0" y="128" class="s" text-anchor="middle" >5 V / GND por rama lógica</text>
<text x="1240.0" y="144" class="s" text-anchor="middle" >470 µF + 100 nF junto a la cámara</text>
<text x="1240.0" y="160" class="s" text-anchor="middle" >Datos: Wi-Fi / HTTP; sin cable de datos al ESP32</text>
<rect x="1040" y="420" width="400" height="120" rx="6" class="blk"/>
<text x="1240.0" y="440" class="t" text-anchor="middle" >MG995 180°</text>
<text x="1240.0" y="458" class="s" text-anchor="middle" >Rojo: rama propia 5 V (no desde el ESP32)</text>
<text x="1240.0" y="474" class="s" text-anchor="middle" >Marrón: GND común; naranja: señal PWM</text>
<text x="1240.0" y="490" class="s" text-anchor="middle" >1000–2200 µF junto al conector</text>
<text x="1240.0" y="506" class="s" text-anchor="middle" >Medir tensión y corriente durante el giro</text>
<path d="M310,120 L440,120" class="v5"/>
<path d="M350,120 L350,70 L1240,70 L1240,90" class="v5"/>
<path d="M350,120 L350,580 L1240,580 L1240,540" class="v5"/>
<text x="780" y="570" class="s" text-anchor="start" >Rama de potencia del servo: 5 V / GND</text>
<path d="M760,200 L960,200 L960,450 L1040,450" class="sig"/>
<rect x="440" y="420" width="420" height="120" rx="6" class="blk"/>
<text x="650.0" y="440" class="t" text-anchor="middle" >HC-SR04 — nivel de tolva</text>
<text x="650.0" y="458" class="s" text-anchor="middle" >VCC 5 V; GND común</text>
<text x="650.0" y="474" class="s" text-anchor="middle" >TRIG ← GPIO19</text>
<text x="650.0" y="490" class="s" text-anchor="middle" >ECHO → 1 kΩ → GPIO21; 2 kΩ del nodo a GND</text>
<text x="650.0" y="506" class="s" text-anchor="middle" >ECHO al GPIO ≤3,4 V con alimentación de 5,1 V</text>
<path d="M600,280 L600,420" class="sig"/>
<path d="M350,380 L650,380 L650,420" class="v5"/>
<text x="40" y="650" class="s" text-anchor="start" font-size="16">GND de fuente, ESP32, cámara, sensor y servo unidos en estrella.</text>
<text x="40" y="685" class="s" text-anchor="start" font-size="16">No conectar 5 V directos a GPIO ni alimentar el servo desde VIN/3V3.</text>
<text x="40" y="720" class="s" text-anchor="start" font-size="16">Sin batería, panel solar, BMS ni convertidores del diseño anterior.</text>
<text x="40" y="755" class="s" text-anchor="start" font-size="16">Cruces sin punto no son uniones. Ver placa_control.svg para el cableado de señales.</text>
<text x="40" y="790" class="s" text-anchor="start" font-size="16">Comprobar montaje y tensión bajo carga antes de conectar animales.</text>
</svg>
