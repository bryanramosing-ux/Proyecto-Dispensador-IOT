<!doctype html><html><head><meta charset="utf-8">
<style>
:root{--tinta:#1f2d3a;--suave:#5d6b78;--naranja:#e8a33d;--azul:#1f4e79;--fondo:#f6f8fb;--tarjeta:#fff}
*{box-sizing:border-box}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:"Noto Sans","DejaVu Sans",Arial,sans-serif;color:var(--tinta)}
body{background:var(--fondo)}
body.transparente{background:transparent}
#marca{position:absolute;right:34px;top:30px;font-size:15px;color:#7a8794}
#titulo{position:absolute;left:56px;top:34px;font-size:38px;font-weight:700;padding-left:18px;border-left:7px solid var(--naranja);line-height:1.15}
#cuerpo{position:absolute;left:56px;right:56px;top:118px;height:488px}
.fila{display:flex;gap:36px;height:100%;align-items:center}
.img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 6px 24px rgba(31,45,58,.12);background:#fff}
.puntos{flex:1;display:flex;flex-direction:column;gap:22px}
.punto{display:flex;gap:16px;align-items:baseline;font-size:27px;line-height:1.3}
.punto b{color:var(--azul);min-width:150px}
.tarjetas{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:190px;gap:28px;align-content:center;height:100%}
.tarjeta{background:var(--tarjeta);border-radius:12px;padding:22px 24px;box-shadow:0 4px 16px rgba(31,45,58,.08);border-top:7px solid}
.tarjeta h3{margin:0 0 10px;font-size:28px}.tarjeta p{margin:0;font-size:21px;color:var(--suave);line-height:1.35}
.flujo{display:flex;align-items:stretch;gap:0;height:100%;padding:40px 0}
.paso{flex:1;background:#fff;border-radius:12px;padding:22px 16px;text-align:center;box-shadow:0 4px 16px rgba(31,45,58,.08);display:flex;flex-direction:column;align-items:center}
.paso .n{width:58px;height:58px;border-radius:50%;background:var(--azul);color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.paso h3{margin:0 0 10px;font-size:25px}.paso p{margin:0;font-size:19px;color:var(--suave);line-height:1.35}
.flecha{width:44px;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--naranja)}
.linea{position:relative;height:250px;margin-top:20px}
.eje{position:absolute;left:30px;right:30px;top:120px;height:6px;background:#cfd8e2;border-radius:3px}
.ev{position:absolute;top:0;width:250px;transform:translateX(-50%);text-align:center}
.ev .foto{width:120px;height:86px;margin:0 auto 14px;border-radius:10px;background:#dfe6ee;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--suave);border:3px solid #cfd8e2}
.ev .foto.ok{background:#e3f4ea;border-color:#2e8b57;color:#2e8b57}
.ev .punto2{width:22px;height:22px;border-radius:50%;background:var(--azul);margin:0 auto 12px;position:relative;top:-2px}
.ev h4{margin:0;font-size:22px}.ev p{margin:4px 0 0;font-size:18px;color:var(--suave)}
.notas{display:flex;gap:20px;margin-top:40px}.nota{flex:1;background:#fff;border-radius:10px;padding:16px 20px;font-size:21px;border-left:6px solid var(--naranja);box-shadow:0 3px 12px rgba(31,45,58,.07)}
.red{position:relative;height:100%}
.nodo{position:absolute;width:250px;background:#fff;border-radius:12px;padding:16px 18px;text-align:center;box-shadow:0 4px 16px rgba(31,45,58,.1);border-top:6px solid var(--azul)}
.nodo h3{margin:0 0 6px;font-size:24px}.nodo p{margin:0;font-size:17px;color:var(--suave)}
.dato{position:absolute;right:0;width:330px;background:var(--azul);color:#fff;border-radius:12px;padding:18px 22px;font-size:22px;line-height:1.4}
.dato b{font-size:40px;display:block}
.nube{position:absolute;right:20px;bottom:10px;width:310px;padding:14px 18px;border-radius:12px;border:3px dashed #c0392b;color:#c0392b;font-size:20px;text-align:center;background:#fff5f4}
.barra{width:120px;height:330px;border-radius:14px;background:#e3e8ee;position:relative;overflow:hidden;border:3px solid #b9c4cf}
.barra div{position:absolute;bottom:0;left:0;right:0}
.umbral{position:absolute;left:130px;font-size:20px;white-space:nowrap;transform:translateY(50%)}
.umbral::before{content:"";position:absolute;left:-14px;top:50%;width:10px;border-top:3px solid currentColor}
.listas{display:flex;gap:40px;height:100%}.lista{flex:1;background:#fff;border-radius:12px;padding:24px 30px;box-shadow:0 4px 16px rgba(31,45,58,.08)}
.lista h3{margin:0 0 16px;font-size:28px;color:var(--azul)}.lista li{font-size:23px;margin:10px 0;line-height:1.3}
.portada{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding-left:110px;background:linear-gradient(120deg,#1f4e79,#2f6fd6)}
.portada h1{color:#fff;font-size:64px;margin:0}.portada p{color:#ffd99a;font-size:28px;margin:18px 0 0}
</style></head><body>
<div id="marca">Dispensador IoT · visión artificial · energía solar</div><div id="titulo"></div><div id="cuerpo"></div>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
window.lamina = (d) => {
  document.body.className = d.transparente ? 'transparente' : '';
  $('#marca').style.display = d.transparente ? 'none' : 'block';
  $('#titulo').textContent = d.titulo || ''; $('#titulo').style.display = d.titulo ? 'block' : 'none';
  if (d.transparente) { $('#titulo').style.background = 'rgba(255,255,255,.92)'; $('#titulo').style.padding = '8px 18px'; $('#titulo').style.borderRadius = '6px'; }
  const c = $('#cuerpo'); let h = '';
  switch (d.plantilla) {
    case 'imagen_lista':
      h = `<div class="fila"><div style="width:${d.ancho || 520}px;height:100%;display:flex;justify-content:center"><img class="img" src="${d.imagen}"></div>
        <div class="puntos">${d.puntos.map(([a,b]) => `<div class="punto"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div></div>`; break;
    case 'tarjetas':
      h = `<div class="tarjetas">${d.tarjetas.map(([a,b,col]) => `<div class="tarjeta" style="border-color:${col}"><h3>${esc(a)}</h3><p>${esc(b)}</p></div>`).join('')}</div>`; break;
    case 'flujo':
      h = `<div class="flujo">${d.pasos.map(([n,a,b],i) => (i ? '<div class="flecha">➜</div>' : '') +
        `<div class="paso"><div class="n">${n}</div><h3>${esc(a)}</h3><p>${esc(b)}</p></div>`).join('')}</div>`; break;
    case 'linea_tiempo':
      h = `<div class="linea"><div class="eje"></div>${d.eventos.map(([a,b,r],i) => {
          const x = 12 + i*25.3, ok = r.includes('✓');
          return `<div class="ev" style="left:${x}%"><div class="foto ${ok?'ok':''}">${esc(i? r : '👋')}</div><div class="punto2"></div><h4>${esc(a)}</h4><p>${esc(b)}</p></div>`;}).join('')}</div>
        <div class="notas">${d.notas.map(n => `<div class="nota">${esc(n)}</div>`).join('')}</div>`; break;
    case 'red':
      h = `<div class="red">
        <div class="nodo" style="left:300px;top:150px;border-color:var(--naranja)"><h3>Router o celular</h3><p>red wifi local · sin Internet</p></div>
        <div class="nodo" style="left:0;top:0"><h3>ESP32</h3><p>decide y controla</p></div>
        <div class="nodo" style="left:0;top:320px"><h3>ESP32-CAM</h3><p>saca la foto</p></div>
        <div class="nodo" style="left:600px;top:0"><h3>Computador</h3><p>OpenCV + red neuronal</p></div>
        <svg style="position:absolute;left:0;top:0" width="860" height="440"><g stroke="#7f8c8d" stroke-width="3" stroke-dasharray="9 7" fill="none">
          <path d="M250 60 L300 170"/><path d="M250 370 L300 230"/><path d="M600 60 L550 170"/></g></svg>
        <div class="dato" style="top:0"><b>≈ 20 ms</b>análisis de cada foto en el computador</div>
        <div class="dato" style="top:170px;background:#2e8b57"><b>0 fotos</b>salen de la sala</div>
        <div class="nube">✕ Internet / nube: no se usa<br><small>(solo el aviso opcional al celular)</small></div></div>`; break;
    case 'dos_imagenes':
      h = `<div class="fila" style="justify-content:center">${d.imagenes.map(s => `<div style="height:100%;flex:1;display:flex;justify-content:center"><img class="img" src="${s}"></div>`).join('')}</div>`; break;
    case 'nivel':
      h = `<div class="fila"><div style="width:560px;height:100%;display:flex;align-items:center"><img class="img" src="${d.imagen}"></div>
        <div style="flex:1;position:relative;height:340px;margin-top:40px">
          <div class="barra"><div style="height:100%;background:linear-gradient(#2e8b57 0 80%,#d98c00 80% 97%,#c0392b 97%)"></div></div>
          <div class="umbral" style="bottom:${330*0.0}px;color:#1f2d3a;top:6px;transform:none"><b>100 %</b> lleno hasta la línea MAX</div>
          <div class="umbral" style="bottom:${330*0.30}px;color:#2e8b57"><b>30 %</b> comida repuesta</div>
          <div class="umbral" style="bottom:${330*0.20}px;color:#d98c00"><b>20 %</b> alerta: comida baja</div>
          <div class="umbral" style="bottom:${330*0.03}px;color:#c0392b"><b>3 %</b> agotada: no entrega</div>
          <div style="position:absolute;left:0;top:350px;font-size:20px;color:var(--suave)">porcentaje del <b>volumen</b> (la tolva es un embudo)</div>
        </div></div>`; break;
    case 'energia':
      h = `<div class="fila"><div style="width:470px;height:100%;display:flex;justify-content:center"><img class="img" src="${d.imagen}"></div>
        <div class="puntos">
          <div class="punto"><b>Batería</b><span>2 celdas de litio en serie + BMS + fusible</span></div>
          <div class="punto"><b>6 V</b><span>solo para el servo (convertidor A)</span></div>
          <div class="punto"><b>5 V</b><span>ESP32, cámara y sensores (convertidor B)</span></div>
          <div class="punto"><b>Panel</b><span>0,3 W frente a 1,75 W de consumo: demostrativo</span></div>
          <div class="punto"><b>Carga</b><span>principal por USB-C</span></div></div></div>`; break;
    case 'imagen_grande':
      h = `<div class="fila" style="justify-content:center"><img class="img" src="${d.imagen}"></div>`; break;
    case 'impresion':
      h = `<div class="fila"><div style="flex:1;height:100%;display:flex;justify-content:center"><img class="img" src="${d.imagen}"></div>
        <div class="puntos" style="flex:0 0 330px">
          <div class="punto"><b style="min-width:0">22</b><span>piezas, sin soportes</span></div>
          <div class="punto"><b style="min-width:0">5</b><span>placas de 320 × 320 mm</span></div>
          <div class="punto"><b style="min-width:0">PETG</b><span>lo que toca el alimento</span></div>
          <div class="punto"><b style="min-width:0">≈ 2,2 kg</b><span>de filamento</span></div></div></div>`; break;
    case 'dos_listas':
      h = `<div class="listas">${d.listas.map(([t, l]) => `<div class="lista"><h3>${esc(t)}</h3><ul>${l.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`; break;
    case 'titulo':
      h = `<div class="portada"><h1>${esc(d.titulo)}</h1><p>${esc(d.sub || '')}</p></div>`;
      $('#titulo').style.display = 'none'; c.style.cssText = 'position:absolute;inset:0;top:0;height:720px;left:0;right:0'; break;
  }
  if (d.plantilla !== 'titulo') c.style.cssText = '';
  c.innerHTML = h;
  return Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));
};
window.listo = true;
</script></body></html>
