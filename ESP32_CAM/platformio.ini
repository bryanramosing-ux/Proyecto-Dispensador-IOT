; PlatformIO - AI-Thinker ESP32-CAM (captura de imágenes)
; Programación: adaptador USB-TTL 3,3 V o placa ESP32-CAM-MB, GPIO0 a GND al subir.
[platformio]
src_dir = Camara_ESP32CAM

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -DBOARD_HAS_PSRAM
