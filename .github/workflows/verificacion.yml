# Verificación automática del proyecto en cada push / pull request.
#   * vision:     pruebas de Python + modelo real con imágenes públicas
#   * mecanica:   genera los STL y ejecuta las 45 verificaciones geométricas (incluye sensor de nivel,
#                 estación solar remota y volumen de la Elegoo Neptune 4 Plus) + plan de placas
#   * logica:     máquina de estados del ESP32 en PC + placa y esquema coherentes con config.h + stubs
#   * firmware:   compilación REAL (cadena de Espressif) con núcleo 2.0.17 y 3.0.7
#   * qemu:       arranca el firmware real del ESP32 en el emulador de Espressif
name: Verificación

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  INDICE_ESP32: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  vision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenCV
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pruebas unitarias y extremo a extremo
        run: python -m unittest discover -s tests -v
      - name: Modelo real (MobileNetV2) con imágenes públicas
        run: |
          python descargar_modelo.py
          python tests/descargar_imagenes_prueba.py imagenes_prueba
          DISPENSADOR_IMAGENES_PRUEBA=imagenes_prueba python -m unittest tests.test_modelo_real -v
          python probar_imagenes.py imagenes_prueba

  mecanica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy trimesh manifold3d matplotlib
      - name: Generar STL y verificar (interferencias, recorrido del alimento, imprimibilidad, nivel, estación solar)
        run: python Mechanical/generar_stl.py
      - name: Placas de impresión para la Neptune 4 Plus (sin laminar)
        run: cd Mechanical && python plan_impresion.py --sin-laminar
      - name: Balance energético
        run: python Documentation/power/calculo_energia.py

  logica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Máquina de estados (26 escenarios, con alertas de nivel y fotos cada 2 s)
        run: make -C ESP32/test_host
      - name: Placa de control coherente con config.h (pines, divisores, conexiones)
        run: python3 Documentation/wiring/generar_placa_control.py
      - name: Esquema completo coherente con config.h
        run: python3 Documentation/wiring/generar_esquema.py
      - name: Compilación contra stubs (API núcleo 2.x y 3.x)
        run: |
          git clone --depth 1 https://github.com/bblanchon/ArduinoJson ESP32/test_host/ArduinoJson
          make -C ESP32/test_host sintaxis

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nucleo: ["2.0.17", "3.0.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: pip install pyserial
      - name: Instalar núcleo esp32 ${{ matrix.nucleo }} y ArduinoJson
        run: |
          arduino-cli core update-index --additional-urls "$INDICE_ESP32"
          arduino-cli core install "esp32:esp32@${{ matrix.nucleo }}" --additional-urls "$INDICE_ESP32"
          arduino-cli lib install "ArduinoJson@7.4.2"
      - name: Compilar ESP32 DevKit V1 (controlador)
        run: arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1 --warnings all ESP32/Dispensador_ESP32
      - name: Compilar ESP32-CAM
        run: arduino-cli compile --fqbn "esp32:esp32:esp32cam:PartitionScheme=huge_app" --warnings all ESP32_CAM/Camara_ESP32CAM

  qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          pip install pyserial "esptool==4.8.1"
          sudo apt-get update -q && sudo apt-get install -y -q libslirp0 libsdl2-2.0-0
      - name: Compilar variante de simulación (sin radio Wi-Fi ni ADC, que QEMU no emula)
        run: |
          arduino-cli core update-index --additional-urls "$INDICE_ESP32"
          arduino-cli core install "esp32:esp32@2.0.17" --additional-urls "$INDICE_ESP32"
          arduino-cli lib install "ArduinoJson@7.4.2"
          arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1 --build-path build/qemu \
            --build-property "compiler.cpp.extra_flags=-DSIMULACION_QEMU" ESP32/Dispensador_ESP32
      - name: Descargar QEMU de Espressif
        run: |
          curl -sSL -o qemu.tar.xz https://github.com/espressif/qemu/releases/download/esp-develop-9.0.0-20240606/qemu-xtensa-softmmu-esp_develop_9.0.0_20240606-x86_64-linux-gnu.tar.xz
          tar xJf qemu.tar.xz
      - name: Autoprueba en el emulador
        run: |
          ESP32/test_host/qemu_autoprueba.sh build/qemu \
            "$HOME/.arduino15/packages/esp32/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin" \
            qemu/bin/qemu-system-xtensa 300
